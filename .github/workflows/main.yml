name: WinHub Fixed Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Functional IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project Files
        run: |
          mkdir -p WinHub
          
          # Create Info.plist
          cat <<'EOF' > WinHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>WinHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.winhub.emulator.promax</string>
            <key>CFBundleName</key>
            <string>WinHub</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>2.1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

          # Create App Entry Point
          cat <<'EOF' > WinHub/App.swift
          import SwiftUI

          @main
          struct WinHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      Text("WINHUB PRO MAX").foregroundColor(.blue).font(.largeTitle)
                  }
              }
          }
          EOF

          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project WinHub.xcodeproj \
            -scheme WinHub \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/WinHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_NAME="WinHub"

      - name: Export and Fix IPA
        run: |
          mkdir -p build/Payload
          # Copy the .app folder
          cp -r build/WinHub.xcarchive/Products/Applications/WinHub.app build/Payload/
          
          # Force permissions on the binary to prevent "Bad file descriptor"
          chmod +x build/Payload/WinHub.app/WinHub
          
          # Create the IPA
          cd build
          zip -r WinHub_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHub-Fixed
          path: build/WinHub_Final.ipa
