name: WinHub
options:
  bundleIdPrefix: com.winhub.emulator
targets:
  WinHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [WinHub]
    settings:
      base:
        INFOPLIST_FILE: WinHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.winhub.emulator.promax
        PRODUCT_NAME: WinHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 2.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
